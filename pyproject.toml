[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spot2ytmusic"
version = "0.2.0"
description = "Move Spotify playlists to YouTube Music or save reviewed recordings as local MP3 playlists"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "SysAdminDoc"}]
dependencies = ["ytmusicapi==1.12.3"]
keywords = ["spotify", "youtube-music", "playlist-migration", "mp3", "yt-dlp"]

[project.urls]
Repository = "https://github.com/SysAdminDoc/Spot2YTMusic"
Issues = "https://github.com/SysAdminDoc/Spot2YTMusic/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "build>=1,<2", "pyinstaller==6.22.3"]
gui = ["PySide6-Essentials==6.11.2"]

[project.scripts]
spot2ytmusic = "spot2ytmusic.cli:main"
spot2ytmusic-gui = "spot2ytmusic.gui_entry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spot2ytmusic = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
